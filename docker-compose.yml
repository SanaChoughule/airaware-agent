# Docker Compose for AirAware Full-Stack Deployment
version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: airaware-backend
    ports:
      - "8080:8080"
    environment:
      - AIRAWARE_DEMO_MODE=false
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: airaware-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
